{% with messages = get_flashed_messages() %}
  {% if messages %}
    <script>
      var messages = {{ messages | safe }};
      for (var i=0; i<messages.length; i++) {
        alert(messages[i]);
      }
    </script>
  {% endif %}
{% endwith %}
    <!-- Starter Section Section -->
  <section id="assign-drugs" class="section">
  <div class="container section-title" data-aos="fade-up">
    <h2>Assign Drugs To Patient</h2>
  </div>

  <div class="container" data-aos="fade-up" data-aos-delay="100">
    <div class="row gy-4 justify-content-center">
      <div class="col-lg-8">
        <form action="/assigndrug" method="post" enctype="multipart/form-data" class="php-email-form" data-aos="fade-up" data-aos-delay="200">

          {% for item in data %}
          <div class="row gy-3">
            <div class="col-12">
              <h5>User Full Information</h5>
            </div>

            <div class="col-md-6">
              <label>User Name:</label>
              <input type="text" class="form-control" value="{{ item[1] }}" readonly>
              <input type="hidden" name="UserName" value="{{ item[1] }}">
            </div>

            <div class="col-md-6">
              <label>Email:</label>
              <input type="email" class="form-control" value="{{ item[3] }}" readonly>
              <input type="hidden" name="Email" value="{{ item[3] }}">
            </div>

            <div class="col-md-6">
              <label>Phone Number:</label>
              <input type="text" class="form-control" value="{{ item[2] }}" readonly>
              <input type="hidden" name="Phone" value="{{ item[2] }}">
            </div>

            <div class="col-md-6">
              <label>Disease Name:</label>
              <input type="text" class="form-control" value="{{ item[7] }}" readonly>
              <input type="hidden" name="Disease" value="{{ item[7] }}">
            </div>
          </div>
          {% endfor %}

          <div class="row gy-3 mt-3">
            <div class="col-md-6">
              <label>Date:</label>
              <input name="Adate" type="date" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label>Upload File:</label>
              <input type="file" name="file" class="form-control">
            </div>

            <div class="col-12">
              <label>Medicine Info:</label>
              <textarea name="Medicine" rows="4" class="form-control" required></textarea>
            </div>

            <div class="col-12">
              <label>Other Info:</label>
              <textarea name="Other" rows="4" class="form-control" required></textarea>
            </div>



            <div class="col-12 text-center mt-3">
              <button type="submit" class="btn btn-primary">Submit</button>
              <button type="reset" class="btn btn-secondary">Reset</button>
            </div>
          </div>

        </form>
      </div>
    </div>
  </div>
</section>
